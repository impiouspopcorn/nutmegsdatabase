<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Nutmeg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-log for a two-person sustainability team. Sticky tab bar; each view is scanned, not read.
   Spruce accent; RAG colours are semantic and kept separate from the accent. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e4eae7; --ink:#15201b; --muted:#56655e; --line:#d3dcd8;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --red:#b93a26; --red-soft:#f7e1dc; --amber:#a86d06; --amber-soft:#f8ecd2; --green:#2c7d47; --green-soft:#dcefe2; --grey:#77827d; --grey-soft:#e6eae8;
  --focus:#1d6b58;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#121a17; --ink:#e3ebe7; --muted:#97a69f; --line:#2a3531;
  --accent:#6cc3a4; --accent-ink:#0b1411; --accent-soft:#1d332b;
  --red:#f08a74; --red-soft:#3a1f1a; --amber:#e9b04f; --amber-soft:#3a2c12; --green:#7fcf98; --green-soft:#1b3324; --grey:#9aa59f; --grey-soft:#242d29;
  --focus:#6cc3a4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#121a17; --ink:#e3ebe7; --muted:#97a69f; --line:#2a3531;
  --accent:#6cc3a4; --accent-ink:#0b1411; --accent-soft:#1d332b;
  --red:#f08a74; --red-soft:#3a1f1a; --amber:#e9b04f; --amber-soft:#3a2c12; --green:#7fcf98; --green-soft:#1b3324; --grey:#9aa59f; --grey-soft:#242d29;
  --focus:#6cc3a4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:20px}
.brand .mono{color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
main{padding-block:24px 48px}
section.view{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--grey-soft);color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey);flex:none}
.rag-Red .dot,.dot.Red{background:var(--red)} .rag-Amber .dot,.dot.Amber{background:var(--amber)} .rag-Green .dot,.dot.Green{background:var(--green)} .rag-Grey .dot,.dot.Grey{background:var(--grey)}
.pill.rag-Red{background:var(--red-soft)} .pill.rag-Amber{background:var(--amber-soft)} .pill.rag-Green{background:var(--green-soft)}
.pill.warn{background:var(--amber-soft)} .pill.alert{background:var(--red-soft)} .pill.acc{background:var(--accent-soft)}

/* week */
.weekhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.weekhead h2{font-size:28px}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;counter-reset:f}
.focus .panel{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.focus .n{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--accent);font-weight:700}
.focus p{margin:0;font-weight:500}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:110px;display:grid;align-content:start;gap:6px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.past{opacity:.6}
.day .dname{font-family:var(--f-display);font-weight:700;font-size:15px}
.day ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.day li{font-size:13px;background:var(--sunk);border-radius:6px;padding:4px 7px}
.day .note{font-size:12px;color:var(--muted);font-style:italic}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.todo{list-style:none;margin:0;padding:0;display:grid}
.todo li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.todo li.done .t{color:var(--muted)}
.todo .mark{width:14px;height:14px;margin-top:4px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--accent-ink)}
.todo li.done .mark{background:var(--accent);border-color:var(--accent)}
.tier + .tier{margin-top:14px}
.tierhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding-bottom:4px;border-bottom:2px solid var(--line)}
.tiername{font-family:var(--f-display);font-weight:700;font-size:15px}
.tier-must .tierhead{border-bottom-color:var(--accent)}
.todo .tag{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.linkid{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-family:var(--f-mono);font-size:12px}
.list{display:grid;gap:0}
.list .it{display:grid;grid-template-columns:72px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list .it .ttl{font-weight:500}
.list .it small{display:block;color:var(--muted);font-size:12px}
.days-left{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.days-left.soon{color:var(--amber);font-weight:600}
.small-note{font-size:12px;color:var(--muted);margin-top:8px}

/* projects */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{font-family:var(--f-display);font-size:24px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3{font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.card .latest{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .flag{font-size:12px;color:var(--ink)}
.card.complete{background:var(--sunk)}
.card.complete h3{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* detail sheet */
dialog.sheet{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100%);background:var(--surface);color:var(--ink);box-shadow:-8px 0 30px rgba(0,0,0,.18)}
dialog.sheet::backdrop{background:rgba(10,20,16,.35)}
.sheet .inner{padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:grid;gap:16px;overflow-y:auto;height:100%}
.sheet h2{font-size:22px}
.editgrid{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px 10px;align-items:center}
.editgrid select,.editgrid input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%}
.edit{background:var(--sunk);border-radius:var(--r);padding:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.block h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.block p{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:12px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* wins */
.wins{display:grid;gap:18px}
.month h3{font-size:14px;font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.win{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.win .t{font-weight:600}
.win .impact{color:var(--ink)}
.win .ev{font-size:12px;color:var(--muted)}
.wingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

/* briefs */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:820px}
.brief h3{font-size:18px;margin:0 0 4px}
.brief h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 6px}
.brief ul{margin:0;padding-left:18px;display:grid;gap:4px}
.brief p{margin:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
input[type=date],input[type=month]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}

footer{border-top:1px solid var(--line);padding-block:18px 28px;color:var(--muted);font-size:12px}
footer .wrap{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:14px}
.lock h1{font-size:30px}
.lock input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.lock label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.lock .err{color:var(--red);font-size:13px;min-height:1.2em}

@media (max-width:860px){.split{grid-template-columns:1fr}.days{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (max-width:520px){.brand h1{font-size:18px}.kv{grid-template-columns:1fr}.list .it{grid-template-columns:62px 1fr}.list .it .days-left{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

(function(){
"use strict";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>{let s="";new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};

/* ---------- unlock (public copy only) ---------- */
async function importPriv(pkcs8){return crypto.subtle.importKey("pkcs8",pkcs8,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"])}
async function openPayload(priv,p){
  const dk=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,b64(p.ek));
  const key=await crypto.subtle.importKey("raw",dk,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p.iv)},key,b64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlockWithPassword(pw,p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(p.wp.salt),iterations:p.wp.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pkcs8=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(p.wp.iv)},kek,b64(p.wp.ct));
  return {pkcs8,priv:await importPriv(pkcs8)};
}
function showLock(msg){
  app.innerHTML=`<div class="lock"><form id="lf" autocomplete="on">
    <div><div class="eyebrow">Private</div><h1>Nutmeg</h1></div>
    <input type="text" name="username" value="nutmeg" autocomplete="username" hidden>
    <label for="pw" class="muted">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="chk"><input id="rem" type="checkbox" checked> Keep unlocked on this device</label>
    <button class="btn" type="submit">Unlock</button>
    <div class="err" id="err">${esc(msg||"")}</div></form></div>`;
  const f=document.getElementById("lf");
  setTimeout(()=>document.getElementById("pw").focus(),50);
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const err=document.getElementById("err");err.textContent="Unlocking…";
    try{
      const {pkcs8,priv}=await unlockWithPassword(document.getElementById("pw").value,BOOT.payload);
      const data=await openPayload(priv,BOOT.payload);
      if(document.getElementById("rem").checked)LS.set("nutmeg.k",toB64(pkcs8));
      start(data);
    }catch(x){err.textContent=window.crypto&&crypto.subtle?"That password didn't work. Try again.":"This browser can't unlock the page. Open it over https in Edge or Chrome."}
  });
}
async function boot(){
  if(BOOT.mode==="plain")return start(BOOT.data);
  const k=LS.get("nutmeg.k");
  if(k){try{const priv=await importPriv(b64(k));return start(await openPayload(priv,BOOT.payload))}catch(e){LS.del("nutmeg.k")}}
  showLock();
}

function start(data){
  D=data;D.projects.forEach(p=>P[p.id]=p);
  const s=new Date(today());s.setDate(s.getDate()-14);state.since=iso(s);state.month=iso(today()).slice(0,7);
  const h=(location.hash||"").slice(1);if(["week","projects","wins","briefs"].includes(h))state.view=h;
  shell();render();
  D.projects.forEach(p=>p._base={theme:p.theme,rag:p.rag,status:p.status,owner:p.owner});
  if(BOOT.mode==="plain"&&window.claude&&claude.use){claude.use("db").then(db=>{if(!db)return;DB=db;
    db.collection("overrides").onSnapshot(snap=>{OVR={};snap.docs.forEach(d=>OVR[d.id]=d.data()||{});applyOverrides();render();
      const sh=document.getElementById("sheet");if(sh&&sh.open&&sh.dataset.pid)openProject(sh.dataset.pid)},()=>{})}).catch(()=>{})}
  window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["week","projects","wins","briefs"].includes(v)){state.view=v;render()}});
}
function shell(){
  const locked=BOOT.mode!=="plain";
  app.innerHTML=`<header class="top"><div class="wrap">
    <div class="brand"><h1>Nutmeg</h1><span class="mono">Last check-in ${esc(fmt(D.meta.updated))}</span></div>
    <nav class="tabs" aria-label="Views">
      ${[["week","This week"],["projects","Projects"],["wins","Wins"],["briefs","Briefs"]].map(([k,l])=>`<button data-v="${k}">${l}</button>`).join("")}
    </nav>
    ${locked?'<button class="iconbtn" id="lockbtn" title="Lock this device">Lock</button>':""}
  </div></header>
  <main><div class="wrap" id="main"></div></main>
  <footer><div class="wrap"><span>Updated by Claude at the Monday and Friday check-ins. Changes go through Claude, so this page is view-only.</span>
  <span class="row"><button class="btn ghost" id="dlp">Download projects (Excel)</button><button class="btn ghost" id="dlw">Download wins (Excel)</button></span></div></footer>
  <dialog class="sheet" id="sheet"></dialog>`;
  app.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;history.replaceState(null,"","#"+state.view);render();window.scrollTo(0,0)});
  const lb=document.getElementById("lockbtn");if(lb)lb.onclick=()=>{LS.del("nutmeg.k");location.reload()};
  document.getElementById("dlp").onclick=()=>download("projects.csv",projectsCSV());

function render(){
  app.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===state.view?"page":"false"));

function idLink(id){return id&&P[id]?`<button class="linkid" data-open="${esc(id)}">${esc(id)}</button>`:""}
function wireOpen(root){root.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();openProject(el.dataset.open)}))}

/* This week */

     <span><b>✓ tick</b> done</span><span><b>→</b> progressed, next step</span><span><b>W: who, what</b> waiting on someone</span><span><b>⭐ or WIN:</b> a win (add a number or quote)</span><span><b>dd/mm</b> new deadline or meeting</span><span><b>NEW</b> could be a project</span></div></div>
   <div class="split">

     <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Priorities this week</h2><button class="btn" id="cpon">Copy for OneNote</button></div>

       <div class="small-note">Tick these off in OneNote, not here. Send the week's OneNote page at the Friday check-in and Claude updates this.</div></div>
     <div class="panel"><h2>Waiting on others</h2>${(W.waiting||[]).length?`<div class="list">${W.waiting.map(x=>{const n=x.since?-daysTo(x.since):null;return `<div class="it"${x.pid?` data-open="${x.pid}"`:""}><span class="when">${esc(x.who||"")}</span><span><span class="ttl">${esc(x.text)}</span><small>${x.pid?esc(x.pid)+" · ":""}${x.since?"since "+esc(fmt(x.since)):""}</small></span>${n!==null&&n>=14?'<span class="pill warn">Chase?</span>':(n!==null?`<span class="days-left">${n}d</span>`:"")}</div>`}).join("")}</div>`:'<div class="empty">Nothing waiting on others.</div>'}<div class="small-note">Your part is done. Flagged "Chase?" after two weeks.</div></div>

  wireOpen(m);

/* Projects */
const GROUPS={Active:p=>ACTIVE.includes(p.status),"Parked & backlog":p=>["Parked","Backlog","Stopped"].includes(p.status),Complete:p=>p.status==="Complete",All:()=>true};
function renderProjects(m){
  const themes=["All",...PILLARS.filter(t=>D.projects.some(p=>p.theme===t))];
  const counts=Object.fromEntries(Object.keys(GROUPS).map(g=>[g,D.projects.filter(GROUPS[g]).length]));
  const blocked=D.projects.filter(p=>ACTIVE.includes(p.status)&&isBlocked(p)).length;
  m.innerHTML=`<section class="view">
   <div class="stats">${[["Active",counts.Active],["Blocked",blocked],["Complete",counts.Complete],["Parked & backlog",counts["Parked & backlog"]]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
   <div class="toolbar">
     <input type="search" id="q" placeholder="Search projects, updates, people" value="${esc(state.q)}" aria-label="Search">
     <select id="th" aria-label="Strategy pillar">${themes.map(t=>`<option ${t===state.theme?"selected":""}>${esc(t)}</option>`).join("")}</select>
     <div class="seg" role="group" aria-label="Status">${Object.keys(GROUPS).map(g=>`<button data-g="${g}" aria-pressed="${state.group===g}">${g}</button>`).join("")}</div>
     <div class="chips" role="group" aria-label="RAG">${["Red","Amber","Green","Grey"].map(r=>`<button class="chip" data-r="${r}" aria-pressed="${state.rags.has(r)}"><span class="dot ${r}"></span>${r}</button>`).join("")}</div>
   </div>
   <div class="grid" id="cards"></div></section>`;
  const draw=()=>{
    const q=state.q.toLowerCase();
    const list=D.projects.filter(GROUPS[state.group]).filter(p=>state.theme==="All"||p.theme===state.theme)
      .filter(p=>!state.rags.size||state.rags.has(p.rag))
      .filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
    const c=document.getElementById("cards");
    c.innerHTML=list.length?list.map(p=>{const u=latest(p);return `<button class="card ${p.status==="Complete"?"complete":""}" data-open="${p.id}">
      <div class="head"><span class="mono muted">${esc(p.id)} · ${esc(p.theme||"")}</span>${ragPill(p.rag)}</div>
      <h3>${esc(p.title)}${OVR[p.id]?' <span class="pill acc">Edited</span>':""}</h3>
      <div class="row"><span class="pill ${p.status==="Complete"?"acc":""}">${esc(p.status)}</span>${p.due?`<span class="pill">Due ${esc(fmt(p.due))}</span>`:""}${isBlocked(p)?'<span class="pill alert">Blocked</span>':""}</div>
      ${p.flag&&!isBlocked(p)?`<div class="flag">${esc(p.flag)}</div>`:""}
      ${u?`<div class="latest"><span class="mono">${esc(fmt(u.date))}</span> ${esc(u.text)}</div>`:""}
    </button>`}).join(""):'<div class="empty">No projects match these filters.</div>';
    wireOpen(c);

  draw();
  m.querySelector("#q").oninput=e=>{state.q=e.target.value;draw()};
  m.querySelector("#th").onchange=e=>{state.theme=e.target.value;draw()};
  m.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{state.group=b.dataset.g;m.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=b.dataset.r;state.rags.has(r)?state.rags.delete(r):state.rags.add(r);b.setAttribute("aria-pressed",state.rags.has(r));draw()});
}

/* Briefs */
function briefGeorge(){
  const s=state.since;const wins=D.wins.filter(w=>(w.date.length===7?w.date+"-28":w.date)>=s);
  const moved=D.projects.filter(p=>ACTIVE.includes(p.status)&&latest(p)&&latest(p).date>=s&&!isBlocked(p)&&p.rag!=="Red");
  const help=D.projects.filter(p=>ACTIVE.includes(p.status)&&(isBlocked(p)||p.rag==="Red"));
  const due=D.projects.filter(p=>p.due&&ACTIVE.includes(p.status)&&daysTo(p.due)>=0&&daysTo(p.due)<=21).sort((a,b)=>a.due.localeCompare(b.due));
  return {title:`Update for George`,sub:`Since ${fmtLong(s)}`,sections:[
    ["Points to raise",((D.week&&D.week.george)||[]).filter(x=>!x.done).map(x=>x.text)],
    ["Wins",wins.map(w=>`${w.title}. ${w.impact||""}${w.evidence?` (${w.evidence})`:""}`)],
    ["Progress",moved.map(p=>`${p.title}: ${latest(p).text}`)],
    ["Blocked or needs support",help.map(p=>`${p.title} (${p.flag||p.rag}). ${p.next||""}`)],

}
function briefTeam(){
  const W=D.week;
  const disc=D.projects.filter(p=>ACTIVE.includes(p.status)&&(p.rag==="Red"||p.rag==="Amber"||isBlocked(p)));
  const due=D.projects.filter(p=>p.due&&ACTIVE.includes(p.status)&&daysTo(p.due)>=0&&daysTo(p.due)<=14).sort((a,b)=>a.due.localeCompare(b.due));
  const done=D.projects.filter(p=>p.status==="Complete"&&latest(p)&&daysTo(latest(p).date)>=-14);

    ["Must do this week",((W.priorities||{}).must||[]).filter(x=>!x.done).map(x=>x.text)],

    ["To discuss",disc.map(p=>`${p.title} – ${p.rag}${isBlocked(p)?", blocked":""}. ${p.flag||""}`)],

const NOISE=/^(no change|no progress|parked\.|no update|still parked)/i;
function inMonth(dt){return dt&&dt.slice(0,7)===state.month}
function monthLabel(){const [y,m]=state.month.split("-").map(Number);return `${MON[m-1]} ${y}`}
function pillarOf(pid){return pid&&P[pid]?P[pid].theme:"Fair transition"}
function briefBoard(){
  const wins=D.wins.filter(w=>inMonth(w.date));
  const secs=[["Strategic overview – candidate headlines",wins.map(w=>`${w.title}. ${w.impact||""}`)]];
  PILLARS.filter(t=>t!=="Team & admin").forEach(t=>{
    const items=[];
    D.projects.filter(p=>p.theme===t).forEach(p=>{const us=(p.updates||[]).filter(u=>inMonth(u.date)&&!NOISE.test(u.text));if(us.length&&!["Parked","Backlog"].includes(p.status))items.push(`${p.title} (${p.status}): ${us[0].text}`)});
    wins.filter(w=>pillarOf(w.pid)===t).forEach(w=>items.unshift(`WIN – ${w.title}`));
    secs.push([t,items]);
  });
  secs.push(["Risks to flag",D.projects.filter(p=>ACTIVE.includes(p.status)&&p.theme!=="Team & admin"&&(isBlocked(p)||p.rag==="Red")).map(p=>`${p.title} – ${p.flag||p.rag}`)]);
  secs.push(["From your own data",["Carbon intensity per MWh supplied (with year-on-year change)","Emissions table: sites and fleet, adjusted to FY end, target and cost to offset"]]);
  return {title:`Board report material – ${monthLabel()}`,sub:"Everything logged this month, grouped by strategy pillar. Cut to what the board needs.",sections:secs};
}
function briefNews(){
  const wins=D.wins.filter(w=>inMonth(w.date));
  const done=D.projects.filter(p=>p.status==="Complete"&&p.theme!=="Team & admin"&&(p.updates||[]).some(u=>inMonth(u.date)));
  const moving=D.projects.filter(p=>ACTIVE.includes(p.status)&&p.status!=="Ongoing (BAU)"&&p.theme!=="Team & admin"&&p.rag!=="Red"&&!isBlocked(p)&&(p.updates||[]).some(u=>inMonth(u.date)));
  const soon=D.projects.filter(p=>p.due&&ACTIVE.includes(p.status)&&p.theme!=="Team & admin"&&daysTo(p.due)>=0&&daysTo(p.due)<=42).sort((a,b)=>a.due.localeCompare(b.due));
  return {title:`Newsletter material – ${monthLabel()}`,sub:"Staff-friendly candidates. Leave out anything commercially sensitive or still awaiting decisions.",sections:[
    ["Celebrate",wins.map(w=>`${w.title}. ${w.impact||""}`)],
    ["Delivered this month",done.map(p=>p.title)],
    ["What's happening",moving.map(p=>`${p.title} (${p.theme})`)],
    ["Coming up",soon.map(p=>`${fmtLong(p.due)} – ${p.title}`)]]};
}
function briefOKR(){
  const themes=PILLARS.filter(t=>t!=="Team & admin");
  const secs=[];
  themes.forEach(t=>{
    const ps=D.projects.filter(p=>p.theme===t);
    const delivered=ps.filter(p=>p.status==="Complete").map(p=>`Delivered: ${p.title}`);
    const flight=ps.filter(p=>ACTIVE.includes(p.status)&&p.status!=="Ongoing (BAU)").map(p=>`In flight: ${p.title}${p.rag?` (${p.rag})`:""}`);
    const carry=ps.filter(p=>["Parked","Backlog"].includes(p.status)&&p.rag==="Red").map(p=>`Unresourced: ${p.title}`);
    const all=[...delivered,...flight,...carry];if(all.length)secs.push([t,all]);
  });
  return {title:"OKR material",sub:"Delivered, in flight and unresourced work by theme – the raw material for next quarter's OKRs",sections:secs};
}
function briefYear(){
  const ws=D.wins.slice().sort((a,b)=>a.date.localeCompare(b.date));const g={};
  ws.forEach(w=>{const k=fmt(w.date.slice(0,7));(g[k]=g[k]||[]).push(`${w.title}. ${w.impact||""}${w.evidence?` Evidence: ${w.evidence}.`:""}`)});
  return {title:"Year in review",sub:`${ws.length} wins logged`,sections:Object.entries(g)};
}
function briefText(b){return `${b.title}\n${b.sub}\n`+b.sections.map(([h,items])=>`\n${h.toUpperCase()}\n`+(items.length?items.map(i=>`• ${i}`).join("\n"):"• Nothing to report")).join("\n")}
function renderBriefs(m){
  const B={george:briefGeorge,team:briefTeam,board:briefBoard,news:briefNews,okr:briefOKR,year:briefYear}[state.brief]();
  m.innerHTML=`<section class="view">
   <div class="toolbar"><div class="seg" role="group" aria-label="Brief">${[["george","George 1:1"],["team","Team catch-up"],["board","Board report"],["news","Newsletter"],["okr","OKR material"],["year","Year in review"]].map(([k,l])=>`<button data-b="${k}" aria-pressed="${state.brief===k}">${l}</button>`).join("")}</div>
   ${state.brief==="george"?`<label class="row muted" for="since">Since <input type="date" id="since" value="${state.since}"></label>`:""}${["board","news"].includes(state.brief)?`<label class="row muted" for="mon">Month <input type="month" id="mon" value="${state.month}"></label>`:""}
   <button class="btn" id="cpb">Copy</button></div>
   <article class="brief"><h3>${esc(B.title)}</h3><p class="muted">${esc(B.sub)}</p>
   ${B.sections.map(([h,items])=>`<h4>${esc(h)}</h4>${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:'<p class="muted">Nothing to report.</p>'}`).join("")}</article>
   <p class="small-note">Generated from the tracker. For a polished version, ask Claude at the check-in.</p></section>`;
  m.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{state.brief=b.dataset.b;renderBriefs(m)});
  const mo=m.querySelector("#mon");if(mo)mo.onchange=e=>{if(e.target.value){state.month=e.target.value;renderBriefs(m)}};
  const si=m.querySelector("#since");if(si)si.onchange=e=>{if(e.target.value){state.since=e.target.value;renderBriefs(m)}};
  m.querySelector("#cpb").onclick=()=>copy(briefText(B));
}

/* utilities */
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function copy(text){
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Select the text and copy it")}ta.remove()};
  try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),fallback)}catch(e){fallback()}
}
const csvCell=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
const csv=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
function projectsCSV(){return csv([["ID","Pillar","Project","Status","RAG","Owner","Due","Issue flag","Next steps","Latest update","Last updated","Rationale"],...D.projects.map(p=>{const u=latest(p);return [p.id,p.theme,p.title,p.status,p.rag,p.owner,p.due,p.flag,p.next,u&&u.text,u&&u.date,p.why]})])}
function winsCSV(){return csv([["Date","Win","Impact","Evidence","Who","Project"],...D.wins.map(w=>[w.date,w.title,w.impact,w.evidence||"",w.who,w.pid])])}
async function download(name,text){
  try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:name,data:new Blob([text],{type:"text/csv"})});return}}}catch(e){toast("Download cancelled");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
boot();
})();
</script>
